name: ci

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more if they ever need it.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # fmt, clippy, catalog-independence and test are independent jobs that run in
  # parallel, so a lint failure never hides test results.

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.99"
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Pinned to a recent stable (matches local dev); stays above the
      # workspace rust-version floor (1.95.0).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.99"
          components: clippy

      # Caches ~/.cargo and ./target keyed on the lockfile. All jobs share the
      # "ci" key; only main writes the cache. `env-vars: ImageOS` keys the cache
      # on the runner image so build-script output never crosses images.
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          env-vars: ImageOS
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # OpenSharing must stay mountable without Unity Catalog, and the protocol and
  # the admin API stay separate. Guard the boundaries:
  # - opensharing-api (protocol) depends on no olai-uc-* crate at all;
  # - the admin API (opensharing-admin-api, and through it opensharing-provider
  #   and opensharing-server's `admin`) takes its models, handler traits and
  #   error from Unity Catalog, but only from olai-uc-common and
  #   olai-uc-handlers, and only with the shares / recipients / providers
  #   resources (plus `axum`): no client, no store, no other resource;
  # - opensharing-api depends on no admin crate, and opensharing-admin-api on
  #   no protocol crate;
  # - opensharing-api is the bare protocol surface: no table format, object
  #   store or engine (those are opensharing-engine's), and opensharing-engine
  #   depends on no catalog and no admin crate;
  # - opensharing-provider (the provider domain) depends on no SQL driver
  #   (opensharing-postgres / opensharing-sqlite hold those);
  # - opensharing-server without `unity` takes its storage access from the
  #   catalog-independent trestle vending crates (olai-storage-credentials,
  #   olai-vended-store, olai-credential-vending), and without `admin` either
  #   it depends on no olai-uc-* crate at all.
  catalog-independence:
    name: catalog-independence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          env-vars: ImageOS
          shared-key: ci
          save-if: false

      - name: Dependency boundaries
        run: |
          set -euo pipefail
          deny() { # <description> <pattern> <cargo tree args...>
            local what="$1" pattern="$2"; shift 2
            if cargo tree --locked -e normal --prefix none "$@" | grep -E "$pattern"; then
              echo "::error::$what"
              exit 1
            fi
          }
          admin_uc_only() { # <description> <cargo tree args...>
            # Only olai-uc-common / olai-uc-handlers, only the admin resources.
            local what="$1" crates features; shift
            crates=$(cargo tree --locked -e normal --prefix none "$@" \
              | grep -E '^olai-uc-' | grep -vE '^olai-uc-(common|handlers) ' || true)
            features=$(cargo tree --locked -e features --prefix none "$@" \
              | grep -oE '^olai-uc-(common|handlers) feature "[^"]+"' \
              | grep -vE 'feature "(axum|http|providers|recipients|shares)"$' | sort -u || true)
            if [ -n "$crates$features" ]; then
              printf '%s\n' "$crates" "$features"
              echo "::error::$what"
              exit 1
            fi
          }
          deny "opensharing-api must not depend on olai-uc-* crates" \
            '^olai-uc-' -p opensharing-api --all-features
          admin_uc_only "opensharing-admin-api may use only the olai-uc-common / olai-uc-handlers admin resources" \
            -p opensharing-admin-api --all-features
          deny "opensharing-api must not depend on the admin crates" \
            '^opensharing-admin' -p opensharing-api --all-features
          deny "opensharing-admin-api must not depend on the protocol crates" \
            '^opensharing-(api|common|client) ' -p opensharing-admin-api --all-features
          deny "opensharing-api must not depend on a table format, object store or the engine" \
            '^(buoyant_kernel|object_store|opensharing-engine) ' -p opensharing-api --all-features
          deny "opensharing-engine must not depend on olai-uc-* crates" \
            '^olai-uc-' -p opensharing-engine --all-features
          deny "opensharing-engine must not depend on the admin crates" \
            '^opensharing-admin' -p opensharing-engine --all-features
          admin_uc_only "opensharing-provider may use only the olai-uc-common / olai-uc-handlers admin resources" \
            -p opensharing-provider --all-features
          deny "opensharing-provider must not depend on sqlx" \
            '^sqlx' -p opensharing-provider --all-features
          deny "opensharing-postgres must not depend on olai-uc-* crates" \
            '^olai-uc-' -p opensharing-postgres --all-features
          deny "opensharing-sqlite must not depend on olai-uc-* crates" \
            '^olai-uc-' -p opensharing-sqlite --all-features
          admin_uc_only "opensharing-server (no unity) may use only the olai-uc-common / olai-uc-handlers admin resources" \
            -p opensharing-server --no-default-features --features postgres,admin
          admin_uc_only "opensharing-server (no unity) may use only the olai-uc-common / olai-uc-handlers admin resources" \
            -p opensharing-server --no-default-features --features sqlite,admin
          deny "opensharing-server (no unity, no admin) must not depend on olai-uc-* crates" \
            '^olai-uc-' -p opensharing-server --no-default-features --features postgres
          deny "opensharing-server (no admin) must not depend on opensharing-admin" \
            '^opensharing-admin' -p opensharing-server --no-default-features --features postgres

      - name: Build without Unity Catalog
        run: |
          cargo check --locked --all-targets -p opensharing-api --no-default-features
          cargo check --locked --all-targets -p opensharing-engine --no-default-features
          cargo check --locked --all-targets -p opensharing-provider --no-default-features
          cargo check --locked --all-targets -p opensharing-server --no-default-features --features postgres
          cargo check --locked --all-targets -p opensharing-server --no-default-features --features postgres,admin
          cargo check --locked --all-targets -p opensharing-server --no-default-features --features sqlite
          cargo check --locked --all-targets -p opensharing-server --no-default-features --features sqlite,admin

      # The share / recipient admin API must work end to end without `unity`
      # (tests/e2e.rs), the store-provisioned host without `admin` either
      # (tests/custom_mount.rs), and the provider's host-store composition
      # without the admin service (provider tests/host_store.rs).
      - name: Test without Unity Catalog
        run: |
          cargo test --locked -p opensharing-server --no-default-features --features postgres,admin
          cargo test --locked -p opensharing-server --no-default-features --features postgres
          cargo test --locked -p opensharing-server --no-default-features --features sqlite,admin
          cargo test --locked -p opensharing-provider --no-default-features --features testing

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dorny/test-reporter publishes a check run with the parsed JUnit results.
      checks: write
    # A disposable database for the Postgres store test
    # (crates/postgres/tests/store.rs), which skips when its URL is unset.
    services:
      postgres:
        image: postgres:17
        # Throwaway database reachable only from the job: no password, so the
        # connection URL below carries no credential.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sharing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          env-vars: ImageOS
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binary (no compile); the ci profile emits JUnit XML.
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-nextest

      - name: Test
        env:
          SHARING_SERVER_TEST_DATABASE_URL: postgres://postgres@localhost:5432/sharing
        run: cargo nextest run --locked --workspace --all-features --profile ci

      # nextest does not run doctests; run them here. Runs even if nextest failed.
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace --all-features --doc

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: nextest results
          path: target/nextest/ci/junit.xml
          reporter: jest-junit

  # Build the server image (crates/server/Dockerfile) and smoke-test it: the
  # binary runs, and `serve` on the in-memory default turns healthy. Nothing is
  # pushed; publishing waits until opensharing-server is released.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Like rust-cache above, only main writes the layer cache.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/server/Dockerfile
          push: false
          load: true
          tags: distributary:ci
          cache-from: type=gha,scope=distributary
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=distributary' || '' }}

      - name: Smoke test
        run: |
          docker run --rm distributary:ci --version
          docker run -d --name sharing -p 8080:8080 --health-interval 2s distributary:ci
          for _ in $(seq 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sharing)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sharing
          [ "$status" = healthy ]
          curl -fsS http://localhost:8080/health
