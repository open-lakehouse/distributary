[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/open-lakehouse/distributary"
readme = "README.md"
# Floor set by the dependency tree (buoyant_kernel 0.28 needs 1.88; the Unity
# Catalog crates behind the server's `unity` feature need 1.95). Keep CI's
# toolchain pin >= this.
rust-version = "1.95.0"
# Crates are versioned independently in each crate's own `[package].version`
# (the release-plz convention), so there is intentionally no workspace-wide
# `version` here.
homepage = "https://github.com/open-lakehouse/distributary"
keywords = ["delta-sharing", "opensharing", "deltalake", "lakehouse"]

[workspace.dependencies]
# The Delta stack: the published `buoyant_kernel` (the Buoyant Data distribution
# of delta-kernel-rs). The `package` aliases keep every `delta_kernel::` /
# `delta_kernel_default_engine::` path unchanged. `default-features = false` +
# an explicit `arrow-59` pins the arrow major.
delta_kernel = { package = "buoyant_kernel", version = "0.28.1", default-features = false, features = [
  "internal-api",
  "default-engine-base",
  "arrow-59",
] }
delta_kernel_default_engine = { package = "buoyant_kernel_engine", version = "0.28.0", default-features = false, features = [
  "arrow-59",
  "rustls",
] }

# The Unity Catalog crates behind `opensharing-server`'s `unity` feature (the
# UC REST catalog source and the UC-shaped credential / external-location admin
# routes). Git-pinned to mangrove until it publishes a release with the
# `credential-vending` feature (the crates.io 0.0.5 predates it); switch to the
# crates.io version then. Fine while every sharing crate is `release = false`.
unitycatalog-client = { package = "olai-uc-client", version = "0.0.5", git = "https://github.com/open-lakehouse/mangrove", rev = "71b202990a4410d7c347d5d433cc52ba75a36d30" }
unitycatalog-common = { package = "olai-uc-common", version = "0.0.5", git = "https://github.com/open-lakehouse/mangrove", rev = "71b202990a4410d7c347d5d433cc52ba75a36d30" }

async-trait = "0.1.83"
axum = { version = "0.8" }
axum-extra = { version = "0.10", features = ["query"] }
bytes = { version = "1.1" }
chrono = { version = "0.4.41", features = ["serde"] }
futures = "0.3.32"
itertools = { version = "0.14.0" }
napi = { version = "3.5", default-features = false, features = [
  "napi9",
  "async",
  "web_stream",
] }
napi-derive = "3.5"
# buffa proto runtime consumed by the generated models. Version tracks the
# `buf.build/anthropics/buffa:v0.7.0` plugin pinned in buf.gen.yaml. NOTE: the
# snake_case JSON wire names (`json_field_names: proto` in trestle.yaml) are a
# trestle post-emit rewrite of buffa's camelCase output — keep this version and
# the plugin version in lockstep and re-verify the wire fixtures on any bump.
buffa = { version = "0.7", features = ["json"] }
buffa-types = { version = "0.7", features = ["json"] }
object_store = { version = "0.13.2", features = ["azure", "aws", "gcp"] }
olai-credential-vending = { version = "0.0.2" }
olai-http = { version = "0.0.9" }
olai-storage-credentials = { version = "0.0.1" }
olai-store = { version = "0.0.6" }
olai-vended-store = { version = "0.0.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "json",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yml = { version = "0.0.12" }
sqlx = { version = "0.8.3" }
thiserror = { version = "2" }
tokio = { version = "1.40" }
tower = { version = "0.5", features = ["limit", "filter", "util"] }
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
  "serde",
  "std",
], default-features = false }
uuid = { version = "1", features = ["serde"] }

[workspace.metadata.typos]
default.extend-ignore-re = [
  # Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
  "(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
  # Line block with # spellchecker:<on|off>
  "(?s)(#|//|<\\!--)\\s*spellchecker:off.*?\\n\\s*(#|//|<\\!--)\\s*spellchecker:on",
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]
files.extend-exclude = ["crates/common/src/models/_gen/**/*", "openapi/**/*"]

[workspace.metadata.typos.default.extend-words]
# to avoid having to name fields r#type
typ = "typ"

# The Neon Function bundle (crates/neon; `just neon build`). Neon's limit is
# 10 MiB zipped: with `opt-level = 3` the server is ~11 MiB zipped, with "z"
# ~7 MiB (aarch64-unknown-linux-gnu, see ARCHITECTURE.md).
[profile.release-neon]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
