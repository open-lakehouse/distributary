version: v2
managed:
  enabled: true
  disable:
    # Disables all go_package changes for this module only
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  # Admin API models (buffa runtime), restricted to the admin packages by
  # `just generate-proto` (`--path`). As for buf.gen.yaml, trestle rewrites the
  # camelCase JSON names to snake_case, so run `buf generate` first.
  - remote: buf.build/anthropics/buffa:v0.7.0
    out: crates/admin/src/models/_gen
    opt:
      - json=true
      - file_per_package=true
