version: v2
managed:
  enabled: true
  disable:
    # Disables all go_package changes for this module only
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  # Model generation (buffa runtime). Raw buffa output uses camelCase JSON
  # names; trestle rewrites them to the snake_case wire names
  # (`json_field_names: proto` in trestle.yaml), so always run `buf generate`
  # BEFORE `trestle generate` (`just generate` does both, in order).
  - remote: buf.build/anthropics/buffa:v0.7.0
    out: crates/common/src/models/_gen
    opt:
      - json=true
      - file_per_package=true
