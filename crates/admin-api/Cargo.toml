[package]
name = "opensharing-admin-api"
version = "0.0.1"
description = "The OpenSharing provider admin API server surface: the Unity Catalog share, recipient and provider handler traits, their axum routers, and a provider authentication port, independent of the recipient-facing protocol."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# The admin models and the handler traits, route functions and error they are
# served with, from mangrove. Only the three admin resources: see the
# catalog-independence CI job.
unitycatalog-common = { workspace = true, features = ["providers", "recipients", "shares"] }
unitycatalog-handlers = { workspace = true, features = ["providers", "recipients", "shares"] }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }

[[test]]
name = "router"
required-features = ["axum"]

[features]
# `axum` gates the route functions, the routers, the provider auth layer, the
# request extractors of the models and the error `IntoResponse`. Without it
# only the models, the handler traits and the error type remain.
default = ["axum"]
axum = ["dep:axum", "unitycatalog-handlers/axum"]
