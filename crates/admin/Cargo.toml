[package]
name = "opensharing-admin"
version = "0.0.1"
description = "OpenSharing provider admin API models: shares, share permissions, recipients and providers, wire-compatible with the Databricks Delta Sharing REST API."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# workspace dependencies in alphabetical order
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# `axum` compiles the generated request extractors for a server built on these
# types. The feature name must be `axum` because the generated extractors
# hard-code `#[cfg(feature = "axum")]`.
axum = ["dep:axum", "dep:axum-extra"]
