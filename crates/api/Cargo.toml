[package]
name = "opensharing-api"
version = "0.0.1"
description = "The OpenSharing / Delta Sharing REST surface: the generated handler traits, the hand-written NDJSON query trait, and the axum routers."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
# Crate-local README (shown on crates.io / docs.rs), overriding the inherited
# workspace-root README which describes the whole project rather than this crate.
readme = "README.md"
rust-version.workspace = true

[dependencies]
# local dependencies in alphabetical order
opensharing-common = { path = "../common", version = "0.0.1" }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }

[[test]]
name = "barebones"
required-features = ["axum"]

[features]
# `axum` gates the generated axum route functions, the hand-written router, the
# bearer-auth layer and the error `IntoResponse`. On by default: this crate
# exists to serve an axum surface. The feature name must be `axum` because the
# generated server code hard-codes `#[cfg(feature = "axum")]`. Consumers that
# only want the traits (no HTTP surface) opt out with `default-features = false`.
default = ["axum"]
axum = [
  "dep:axum",
  "dep:axum-extra",
  "opensharing-common/axum",
]

[package.metadata.docs.rs]
all-features = true
