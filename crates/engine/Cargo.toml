[package]
name = "opensharing-engine"
version = "0.0.1"
description = "An OpenSharing / Delta Sharing implementation over pluggable ports: share catalog, sharing policy, storage access and table formats, with a delta_kernel-backed Delta format."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# local dependencies in alphabetical order
opensharing-api = { path = "../api", version = "0.0.1", default-features = false }
opensharing-common = { path = "../common", version = "0.0.1" }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
delta_kernel = { workspace = true }
delta_kernel_default_engine = { workspace = true, optional = true }
futures = { workspace = true }
http = { version = "1", optional = true }
object_store = { workspace = true }
olai-credential-vending = { workspace = true, optional = true }
olai-storage-credentials = { workspace = true, optional = true, features = ["sharing"] }
olai-vended-store = { workspace = true, optional = true, features = ["aws", "azure", "gcp", "fs"] }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = { workspace = true }
# Stable file ids in query responses (v5 = name-based).
uuid = { workspace = true, features = ["v5"], optional = true }

[dev-dependencies]
axum = { workspace = true }
opensharing-api = { path = "../api", version = "0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }

# The handler, router, query and mount tests drive the in-memory ports, which
# live behind the `testing` feature.
[[test]]
name = "handler"
required-features = ["testing"]

[[test]]
name = "router"
required-features = ["testing"]

[[test]]
name = "query"
required-features = ["testing"]

[[test]]
name = "mount"
required-features = ["testing"]

[[test]]
name = "policy"
required-features = ["testing"]

[features]
default = ["delta", "vending"]
# The kernel-backed Delta table format (`format::delta`).
delta = ["dep:delta_kernel_default_engine", "dep:uuid"]
# Catalog sources (`source`) and `vending::SourceStorageAccess`: storage access
# delegated to the source catalog or minted locally, over the catalog-independent
# trestle credential vending crates.
vending = [
  "dep:http",
  "dep:olai-credential-vending",
  "dep:olai-storage-credentials",
  "dep:olai-vended-store",
]
# In-memory port implementations (`testing`) for exercising the sharing logic
# (discovery, query, asset serving) without a real host. Downstream hosts can
# enable it to test their own wiring.
testing = ["delta"]

# docs.rs builds with default features only; enable all features there so the
# `testing` module is documented.
[package.metadata.docs.rs]
all-features = true
