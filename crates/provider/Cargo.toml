[package]
name = "opensharing-provider"
version = "0.0.1"
description = "The OpenSharing provider domain as a library: shares mapped onto source-catalog assets, recipients and their bearer tokens, grants, sealed secrets, the admin API service, and the context, policy and catalog it plugs into the protocol."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# local dependencies in alphabetical order
opensharing-admin-api = { path = "../admin-api", version = "0.0.1", optional = true }
opensharing-api = { path = "../api", version = "0.0.1" }
opensharing-engine = { path = "../engine", version = "0.0.1" }
# The store ports, records, stores and token rules (shares, recipients, tokens
# and grants). Only the shared error of olai-uc-common: see the
# catalog-independence CI job.
unitycatalog-sharing = { workspace = true, features = ["memory"] }

# workspace dependencies in alphabetical order
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
olai-credential-vending = { workspace = true }
olai-storage-credentials = { workspace = true, features = ["sharing"] }
olai-store = { workspace = true, features = ["encryption"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
tower = { workspace = true }

[[test]]
name = "memory"
required-features = ["testing"]

[features]
default = ["admin"]
# The provider admin API service (shares, permissions, recipients, activation
# links) on the Unity Catalog handler traits `opensharing-admin-api` exposes.
admin = ["dep:opensharing-admin-api"]
# `testing::round_trips`, the conformance suite every store implementation runs
# (from `olai-uc-sharing`).
testing = ["unitycatalog-sharing/testing"]

[package.metadata.docs.rs]
all-features = true
