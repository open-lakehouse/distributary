[package]
name = "opensharing-sqlite"
version = "0.0.1"
description = "The SQLite implementation of the OpenSharing provider's store traits (sqlx), with embedded migrations, for single-node deployments."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# local dependencies in alphabetical order
opensharing-provider = { path = "../provider", version = "0.0.1", default-features = false }
# The store and its migrations. Only the shared error of olai-uc-common: see
# the catalog-independence CI job.
unitycatalog-sharing = { workspace = true, features = ["sqlite"] }

# workspace dependencies in alphabetical order
sqlx = { workspace = true, features = [
  "runtime-tokio-rustls",
  "migrate",
  "sqlite",
] }

[dev-dependencies]
opensharing-provider = { path = "../provider", version = "0.0.1", default-features = false, features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
