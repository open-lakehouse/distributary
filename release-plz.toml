# release-plz configuration — automated, independent per-crate releases.
#
# release-plz (https://release-plz.dev) analyzes conventional commits *per
# crate* to compute semver bumps, regenerates per-crate changelogs, keeps
# intra-workspace dependency version requirements in sync, and publishes to
# crates.io in topological order.
#
# Bootstrap gate: crates.io OIDC trusted publishing cannot create a name that has
# never been published, and none of the `opensharing-*` names has been. Each
# crate therefore carries `release = false` until a one-time token publish has
# created it and its Trusted Publisher is registered. Bootstrap order (root ->
# leaf): common, admin -> client, api, admin-api -> server.
#
# `opensharing-server` additionally depends on the git-pinned Unity Catalog
# crates (see the workspace Cargo.toml); it cannot publish until those are
# re-pinned to a crates.io release.
#
# Config reference: https://release-plz.dev/docs/config

[workspace]
# Link PRs/commits in the generated changelog back to the repo.
repo_url = "https://github.com/open-lakehouse/distributary"

# --- Versioning / changelog ---
changelog_update = true        # regenerate per-crate CHANGELOG.md on each release
dependencies_update = false    # don't `cargo update` during the release PR
semver_check = true            # cargo-semver-checks before bumping

# --- Git tags & GitHub releases (per-crate) ---
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_enable = true
git_release_name = "{{ package }} v{{ version }}"
git_release_body = "{{ changelog }}"

# --- Publishing ---
# With `id-token: write` in the workflow, release-plz performs crates.io OIDC
# trusted publishing, so no CARGO_REGISTRY_TOKEN is required.
publish = true
publish_timeout = "30m"

# --- Release PR appearance ---
pr_labels = ["release"]
pr_draft = false

# ---------------------------------------------------------------------------
# Per-package overrides. `changelog_path` is pinned because the directory name
# (e.g. crates/common) differs from the package name (opensharing-common).
# ---------------------------------------------------------------------------
[[package]]
name = "opensharing-common"
changelog_path = "crates/common/CHANGELOG.md"
# Bootstrap gate (see top). The root of the crates; bootstrapped first.
release = false

[[package]]
name = "opensharing-client"
changelog_path = "crates/client/CHANGELOG.md"
# Bootstrap gate (see top), after opensharing-common.
release = false

[[package]]
name = "opensharing-admin"
changelog_path = "crates/admin/CHANGELOG.md"
# Bootstrap gate (see top). No in-repo dependencies; bootstrapped first,
# alongside opensharing-common.
release = false

[[package]]
name = "opensharing-admin-api"
changelog_path = "crates/admin-api/CHANGELOG.md"
# Bootstrap gate (see top), after opensharing-admin.
release = false

[[package]]
name = "opensharing-api"
changelog_path = "crates/api/CHANGELOG.md"
# Bootstrap gate (see top), after opensharing-common.
release = false

[[package]]
name = "opensharing-server"
changelog_path = "crates/server/CHANGELOG.md"
# Bootstrap gate (see top), after opensharing-api and
# opensharing-admin-api; also blocked on the
# git-pinned Unity Catalog crates.
release = false

[[package]]
name = "opensharing-neon"
# Deployment artifact (Neon Function bundle), never published.
publish = false
release = false

# ---------------------------------------------------------------------------
# Changelog rendering (git-cliff, embedded). Conventional-commit grouping.
# ---------------------------------------------------------------------------
[changelog]
protect_breaking_commits = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^doc",      group = "Documentation" },
  { message = "^build",    group = "Build" },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
  { message = "^ci",       skip = true },
]

# Strip the redundant "(scope)" from each rendered line — each crate's changelog
# is already crate-scoped.
commit_preprocessors = [
  { pattern = '\((common|admin|admin-api|client|api|server|neon)\)', replace = "" },
]
