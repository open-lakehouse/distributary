# Trestle codegen config for the provider admin API protos
# (`proto/opensharing/{shares,recipients,providers}`).
#
# Kept apart from trestle.yaml: the admin and protocol packages define messages
# with the same names (`Share`, `ListSharesRequest`, …), and one trestle run
# over both cross-wires the generated protocol client builders. Each config gets
# its own descriptor set (see `just generate-code`). This config emits the
# models (`opensharing-admin`) and the handler traits + route functions
# (`opensharing-admin-api`, under `src/codegen`).
version: 1
project:
  name: opensharing-admin
generate:
  proto_lib: buffa
  # snake_case JSON field names on the wire, matching the Databricks REST API.
  json_field_names: proto
  descriptors: admin-descriptors.bin

  servers:
    rest: true

  models:
    dir: crates/admin/src/models
    crate_name: opensharing_admin

  server:
    output: crates/admin-api/src
    # Generic over the context `Cx`, like the protocol traits: the default is
    # the crate-neutral `DefaultContext`; a host plugs in its own context.
    context_type: crate::DefaultContext
    error_type_path: crate::error::Error
    resource_enum: false
    store_integration: false
    object_conversions: false
    resource_clients: false
